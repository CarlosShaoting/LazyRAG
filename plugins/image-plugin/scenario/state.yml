initial: __start__

# {{placeholder}} substitution rules (performed by Go before launching the SubAgent):
#
#   {{user_input}}           — the user's original request text
#   {{runtime_instruction}}  — ephemeral per-run instruction for retries
#   {{<artifact_id>}}        — value of an artifact saved by a prior step
#                              (text → text field; image → url field)

transitions:
  __start__:
    - to: analyze_subject
      condition: "Cold start — always enter subject analysis first."

  analyze_subject:
    - to: collect_materials
      condition: "Need to find or collect a source/reference image on the web."
    - to: enhance_image
      condition: "EDIT_UPLOAD — user uploaded source image; raw image prepared in analyze_subject."
    - to: analyze_subject
      condition: "Re-analyze (full retry)."

  collect_materials:
    - to: optimize_prompt
      condition: "CREATE_NEW or KB_STYLE — proceed to prompt optimization and text-to-image."
    - to: enhance_image
      condition: "FIND_AND_EDIT — raw image and edit instruction prepared in collect_materials."
    - to: collect_materials
      condition: "Re-collect materials (full or partial retry)."

  optimize_prompt:
    - to: generate_image
      condition: "Prompt ready — proceed to text-to-image generation."
    - to: optimize_prompt
      condition: "User wants to re-optimize the prompt (full retry)."

  generate_image:
    - to: enhance_image
      condition: "Raw image generated — proceed to enhancement."
    - to: generate_image
      condition: "Regenerate with the same prompt (full retry)."
    - to: optimize_prompt
      condition: "User is unhappy with the image — re-optimize prompt."

  enhance_image:
    - to: __end__
      condition: "User is satisfied — pipeline complete."
    - to: enhance_image
      condition: "Re-enhance (full or partial retry)."
    - to: generate_image
      condition: "User wants to regenerate from scratch via text-to-image."
    - to: collect_materials
      condition: "User wants a different source photo."

steps:
  analyze_subject:
    label: Analyze Subject
    prompt: |
      You are an expert art director and image analyst.

      The user wants to create or edit an image with this description:
      {{user_input}}

      {{runtime_instruction}}

      Your task:
      1. If the system prompt lists user-uploaded images under "## User Uploaded Files",
         call find_user_attachment(filename) to get the local path, then call vision_extractor
         (multimodal tool, same as Chat) with that path or short filename — do NOT pass
         signed /static-files/ URLs. Incorporate the visual description into your analysis.
      2. Identify the main subject(s) and sub-topics that require reference materials.
      3. Suggest a suitable artistic style (photorealistic, oil painting, anime, etc.).
      4. Note mood, lighting, and composition hints from the user text and any uploaded images.
      5. Classify the workflow and include it explicitly in the saved analysis:
           WORKFLOW: <one of CREATE_NEW | KB_STYLE | FIND_AND_EDIT | EDIT_UPLOAD>
           - CREATE_NEW — brand-new image from scratch (text-to-image).
           - KB_STYLE — user wants style/content from a selected knowledge base as reference
             (e.g. "根据知识库中的风格画图"). kb_search runs in THIS step only.
           - FIND_AND_EDIT — user asks to find/search an existing photo online, then edit it.
             Use this even when older session attachments exist, unless the user clearly
             refers to a newly uploaded image for this request.
           - EDIT_UPLOAD — user uploaded the source image for THIS edit request and wants to
             edit that upload directly (not search the web for a new photo).
           NEXT_STEPS: <comma-separated step ids, e.g.
             "collect_materials,optimize_prompt,generate_image,enhance_image" or
             "collect_materials,enhance_image" or "enhance_image">
           SKIP_STEPS: <comma-separated step ids to skip, or "none">
      6. If the runtime instruction mentions a selected knowledge base, filters.kb_id is set,
         or the user explicitly references 知识库 / knowledge base style, prefer WORKFLOW: KB_STYLE.
      7. Knowledge base retrieval (kb_search) is allowed ONLY in this step — never in later steps.
         When a knowledge base is available (any of the above) or WORKFLOW is KB_STYLE:
           a. Call kb_search at least once about visual style, color palette, composition, or
              subject matter implied by the user request.
              filters.kb_id is pre-configured — do NOT pass kb_id manually.
           b. From text hits, extract style keywords and save:
                save_artifact(key='material_summary', content_type='text', value=<summary>)
           c. From image hits, validate then save each reference image:
                validate_image_ref(url=<metadata.local_path or image_url>)
                save_artifact(key='material_image', content_type='image', value=<url from ok result>)
              Skip hits with status invalid.
      8. Save the structured analysis:
           save_artifact(key='subject_analysis', content_type='text', value=<analysis text>)
      9. If WORKFLOW is KB_STYLE, FIND_AND_EDIT, or CREATE_NEW:
         - Save subject_analysis; for KB_STYLE also save material_summary and/or material_image
           when kb_search was used (step 7).
         - Do NOT save generated_image_url or optimized_prompt.
         - Set NEXT_STEPS for KB_STYLE / CREATE_NEW to:
             collect_materials,optimize_prompt,generate_image,enhance_image
         - Set NEXT_STEPS for FIND_AND_EDIT to: collect_materials,enhance_image
      10. If WORKFLOW is EDIT_UPLOAD and the user uploaded an image for this request:
         a. Use find_user_attachment to get the local `path` of the upload.
         b. Save raw image:
              save_artifact(key='generated_image_url', content_type='image', value=<path>)
         c. Save a concise English edit instruction (NOT a text-to-image prompt):
              save_artifact(key='optimized_prompt', content_type='text', value=<edit instruction>)
         Then stop — web/KB search is not needed for this path.

      Keep the analysis concise (100–200 words). Stop after saving required artifacts only.
    tools:
      - kb
      - multimodal
      - validate_image_ref
    outputs:
      - artifact_id: subject_analysis
        content_type: text
        slot_id: subject_analysis
        required: true
      - artifact_id: material_summary
        content_type: text
        slot_id: material_summary
        required: false
      - artifact_id: material_image
        content_type: image
        slot_id: material_images
        required: false
    acceptance_criteria: |
      subject_analysis artifact must be saved and contain at least 50 words with WORKFLOW and NEXT_STEPS.
      For KB_STYLE with a knowledge base available: material_summary and/or at least one
      KB-sourced material_image must be saved in this step.
      For KB_STYLE / CREATE_NEW / FIND_AND_EDIT: do NOT save generated_image_url or optimized_prompt.
      For EDIT_UPLOAD workflow, generated_image_url and optimized_prompt must also be saved.

  collect_materials:
    label: Collect Reference Materials
    prompt: |
      You are a research agent that collects reference images for an art project.

      Subject analysis:
      {{subject_analysis}}

      {{runtime_instruction}}

      Your task:
      0. Save only materials for THIS step. Do NOT save generated_image_url or
         optimized_prompt unless WORKFLOW is FIND_AND_EDIT. For KB_STYLE / CREATE_NEW,
         web-sourced material_image is enough when needed — KB style materials were
         collected in analyze_subject. Never write placeholder text.
      - Read WORKFLOW from subject_analysis.
      - Do NOT call kb_search — knowledge base retrieval runs only in analyze_subject.
         For KB_STYLE, use material_summary / material_image already saved in analyze;
         if they are missing, stop with a note to re-run analyze_subject.
      - For FIND_AND_EDIT and other web workflows, you MUST call web_search at least once
        for each web-sourced subject item before calling image_search_tool (skip web search
        only for pure style-reference items when WORKFLOW is CREATE_NEW and KB materials
        already exist from analyze).
      - If web_search is unavailable, fall back to wikipedia, then continue.
      - If both web_search and wikipedia are unavailable, STOP with a failure note.
      - For web-sourced items, call image_search_tool, then for EACH candidate URL:
          1. Call validate_image_ref(url=<candidate>) — probe only, no full download
          2. If status is ok, save:
               save_artifact(key='material_image', content_type='image', value=<url>)
             Use the url field from validate_image_ref.
          3. If status is invalid, try the next candidate (at least 3 attempts).
        Do not save URLs that failed validation — they must not appear in the frontend.
      - If the user uploaded reference images, use find_user_attachment(path) and save
        as material_image when appropriate.
      - If WORKFLOW is FIND_AND_EDIT, after validating and saving the best subject photo
        as material_image, also in the SAME step (use the **same validated URL**, not an
        edited or generated image):
          1. save_artifact(key='generated_image_url', content_type='image',
                            value=<same validated url as material_image>)
          2. save_artifact(key='optimized_prompt', content_type='text',
                            value=<concise English edit instruction from user_input>)
        Example edit instruction: "Add bold red Chinese characters '王老吉' on the jersey
        chest, keeping the rest of the photo realistic and unchanged."
      - Follow any "Partial retry instruction" block for sort_order on list slots.
      - Stop after all required artifacts are saved.
    tools:
      - multimodal
      - web_search
      - wikipedia
      - image_search_tool
      - validate_image_ref
    inputs:
      - artifact_id: subject_analysis
        required: true
    outputs:
      - artifact_id: material_image
        content_type: image
        slot_id: material_images
        required: false
      - artifact_id: generated_image_url
        content_type: image
        slot_id: image_output
        required: false
      - artifact_id: optimized_prompt
        content_type: text
        slot_id: prompt_used
        required: false
      - artifact_id: material_summary
        content_type: text
        slot_id: material_summary
        required: false
    acceptance_criteria: |
      For KB_STYLE: material_summary and/or material_image must already exist from
      analyze_subject — do not kb_search here. If missing, RETRY analyze_subject.
      For KB_STYLE / CREATE_NEW: do NOT save generated_image_url or optimized_prompt.
      For web workflows (FIND_AND_EDIT / CREATE_NEW without KB materials): at least one
      material_image must be saved (url that passed validate_image_ref).
      For FIND_AND_EDIT workflow, generated_image_url and optimized_prompt must also be saved.

  optimize_prompt:
    label: Optimize Prompt
    prompt: |
      You are a professional image-generation prompt engineer.

      Subject analysis:
      {{subject_analysis}}

      Reference materials collected:
      {{material_image}}

      Knowledge base style reference (if any):
      {{material_summary}}

      Original user request:
      {{user_input}}

      {{runtime_instruction}}

      Your task:
      1. Combine the analysis, KB style reference, and material images into a high-quality
         English image-generation prompt (50–200 words, rich in visual detail).
      2. When material_summary or KB-sourced material_image exist, mirror their color
         palette, composition, and artistic style in the prompt.
      3. Include style modifiers, lighting, composition, and quality keywords.
      4. Save the result:
           save_artifact(key='optimized_prompt', content_type='text', value=<prompt>)

      Stop after saving. Do not output anything else.
    inputs:
      - artifact_id: subject_analysis
        required: true
      - artifact_id: material_image
        required: false
      - artifact_id: material_summary
        required: false
    outputs:
      - artifact_id: optimized_prompt
        content_type: text
        slot_id: prompt_used
    acceptance_criteria: |
      optimized_prompt artifact must be saved, in English, and contain at least 30 words.

  generate_image:
    label: Generate Image
    prompt: |
      You are an image generation agent.

      Use the following optimized prompt to generate an image:
      {{optimized_prompt}}

      {{runtime_instruction}}

      Steps:
      1. Call image_generator exactly ONCE with:
           prompt=<optimized_prompt>, image_size='1024x1024', batch_size=1.
      2. If the tool call fails, STOP immediately with a concise failure note.
      3. Take `local_path` (preferred) or `image_url` — do NOT fabricate paths.
      4. Save:
           save_artifact(key='generated_image_url', content_type='image', value=<local_path or image_url>)
      5. Final text image links MUST start with `/static-files/` if present.
      6. Stop after saving.
    tools:
      - image_generator
    inputs:
      - artifact_id: optimized_prompt
        required: true
    outputs:
      - artifact_id: generated_image_url
        content_type: image
        slot_id: image_output
    acceptance_criteria: |
      generated_image_url artifact must be saved with a valid local path or http(s) URL.

  enhance_image:
    label: Enhance Image
    prompt: |
      You are an image enhancement / editing agent.

      Raw image (if already saved):
      {{generated_image_url}}

      Reference materials (fallback source):
      {{material_image}}

      Original user request:
      {{user_input}}

      Edit / style instruction:
      {{optimized_prompt}}

      {{runtime_instruction}}

      Your task:
      1. Resolve the source image (the **original photo**, not an AI-generated image):
         - Prefer generated_image_url if present (should be the raw photo from collect_materials).
         - Else call get_artifact(key='material_image') and use the best subject photo.
         - Else use find_user_attachment for user uploads.
         - If validation is uncertain, call validate_image_ref first.
      2. Call validate_image_ref if not already validated. Proceed only when status is ok.
      3. Call image_editor (NOT image_generator) with:
           prompt=<edit instruction from optimized_prompt and user_input>
           urls=[<url from validate_image_ref or validated artifact>]
      4. Take `local_path` (preferred) or `image_url` from the tool result.
      5. Save the **edited** image ONLY here:
           save_artifact(key='enhanced_image_url', content_type='image', value=<local_path or image_url>)
         Do NOT call save_artifact(key='generated_image_url', ...) in this step — that slot
         must keep the original raw photo from collect_materials.
         For partial retry, pass sort_order=N per the "Partial retry instruction" block.
      6. Final text image links MUST start with `/static-files/` if present.
      7. Stop after saving.
    tools:
      - image_editor
      - multimodal
      - validate_image_ref
    inputs:
      - artifact_id: generated_image_url
        required: false
      - artifact_id: material_image
        required: false
      - artifact_id: optimized_prompt
        required: false
    outputs:
      - artifact_id: enhanced_image_url
        content_type: image
        slot_id: enhanced_image_output
    acceptance_criteria: |
      enhanced_image_url artifact must be saved with a valid local path or http(s) URL.
