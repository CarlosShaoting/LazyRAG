initial: __start__

transitions:
  __start__:
    - to: analyze_requirements

  analyze_requirements:
    - to: generate_ppt
      when: >
        Prefer this when the requirement brief plus the user request / uploaded
        PDF or chat context already contain enough facts to build the deck,
        and no KB/web photos need embedding in the slides.
        Skip collect_materials unless extra research or real images are needed.
    - to: collect_materials
      when: >
        Use when the deck still needs KB retrieval, web research, real photos /
        diagrams for HTML slides, or a dedicated material_summary beyond what
        analyze_requirements already captured.

  collect_materials:
    - to: generate_ppt

  generate_ppt:
    - to: __end__

steps:
  analyze_requirements:
    label: Analyze Requirements
    mode: auto
    route: choice
    prompt: |
      You are a senior presentation strategist.

      User request:
      {{user_input}}

      {{runtime_instruction}}

      Analyze the presentation requirements. Produce a concise but useful
      requirement brief in the user's language.

      Include:
      - presentation goal
      - target audience
      - expected slide count; infer 4-6 slides if not specified (max 10)
      - tone and visual style (free description: e.g. cyberpunk neon, ink wash,
        corporate blue, cinematic space — NOT a fixed theme enum)
      - required sections / narrative arc
      - available source material and missing information
      - practical assumptions
      - whether real photos/diagrams from KB or web should be collected for
        embedding in slide HTML (default: yes when the topic is product /
        industry / case-study visual; otherwise CSS/SVG/ECharts only)
      - whether decorative AI-gen images are needed (default: no)

      If the user already attached a PDF/report or pasted key facts, fold the
      usable numbers and claims into the brief so a later generate_ppt step can
      skip a separate collect_materials pass — unless real KB/web images are
      still needed for the slides.

      Save the result:
        save_artifact(key='requirement_analysis', content_type='text', value=<analysis>)

      Stop after saving. Do not call advance tools yourself.
    outputs:
      - material: requirement_analysis
    acceptance_criteria: |
      requirement_analysis must be saved and must cover goal, audience, slide
      count, tone/style, structure, constraints, and assumptions.

  collect_materials:
    label: Collect Materials
    mode: auto
    prompt: |
      You are a presentation research and material collection assistant.

      This step is OPTIONAL. Prefer analyze_requirements → generate_ppt when
      the brief already has enough facts from the user request or an uploaded
      report. Run this step when KB/web research, a dedicated summary, or
      real images for the slides are still needed.

      Requirement analysis:
      {{requirement_analysis}}

      Uploaded material files, if the user added any through the plugin panel:
      {{uploaded_materials}}

      Original user request:
      {{user_input}}

      {{runtime_instruction}}

      Collect facts AND visual assets that should guide the presentation.
      Use the conversation, uploaded files, requirement analysis, knowledge-base
      retrieval, and web research.

      Uploaded file parsing:
      - If the user uploaded a PDF/DOC/DOCX/PPTX or says "这个文件/这个 PDF",
        call read_user_attachment(filename=<uploaded filename>) to extract text.
      - If multiple files are available, read the ones that are relevant.
      - If a file cannot be parsed, mention the filename and the parsing error
        in gaps/assumptions.

      Retrieval policy (do this before writing the summary):
      1. Facts from KB: if the user mentions a knowledge base / selected docs,
         or the topic looks internal, call kb (semantic search). Prefer hits
         with numbers, definitions, and product facts. When kb returns image
         hits, keep their local_path or image_url + a short caption.
      2. Facts from the web: if the topic needs current public facts, call
         web_search (one intent per query). Use wikipedia only as a thin fallback.
      3. Images for slides (required when visuals would help, or the user /
         analysis asks for photos/diagrams/产品图):
         a) Register KB image hits first via ppt_register_material_images with
            [{"local_path":..., "caption":..., "source":"kb"}, ...]
            (image_url also works if local_path is absent).
         b) For public visual concepts, call ppt_search_web_images(query=...),
            then ppt_register_material_images with
            [{"url":..., "caption":..., "source":"web"}, ...] for 2–6 chosen URLs.
         c) Cap at ~6 useful images total. Prefer real photos/diagrams over
            decorative stock. Do not fabricate URLs.
      4. Do not fabricate citations.

      These registered images are auto-attached at ppt_init_deck and embedded
      into the final slide HTML as foreground <img> (via outline use_image).

      Produce a material summary with:
      - uploaded file summaries, if any
      - key facts or claims to support
      - useful source material or references
      - registered visual assets (caption + source=kb|web) that will appear in HTML
      - open gaps and assumptions

      Save the result:
        save_artifact(key='material_summary', content_type='text', value=<summary>)

      Stop after saving.
    tools:
      - kb
      - web_search
      - wikipedia
      - ppt_search_web_images
      - ppt_register_material_images
    inputs:
      - material: requirement_analysis
        required: true
      - material: uploaded_materials
        required: false
    outputs:
      - material: material_summary
      - material: material_images
    acceptance_criteria: |
      material_summary must be saved and must identify uploaded-file findings
      when files are present, references, useful evidence, gaps, and assumptions.
      When KB/web images were needed, material_images should be registered via
      ppt_register_material_images so generate_ppt can embed them in HTML.

  generate_ppt:
    label: Generate PPT
    mode: auto
    prompt: |
      You are a PPT pipeline orchestrator. You do NOT hand-write full slide HTML
      and you do NOT emit slide JSON templates. You MUST drive generation through
      the ppt_* tools (runtime stages under plugins/ppt-plugin/runtime) and then persist artifacts.
      LLM stages reuse the same chat model as this SubAgent (AutoModel llm) —
      do not ask for SN_API_KEY or invent a separate model.

      Requirement analysis:
      {{requirement_analysis}}

      Material summary (may be empty if collect_materials was skipped — then rely
      on requirement_analysis + user_input + facts already in the brief):
      {{material_summary}}

      Original user request:
      {{user_input}}

      {{runtime_instruction}}

      ## Mode selection

      ### A) Single-page edit
      If user_input / runtime_instruction asks to modify specific pages
      (e.g. "改第3页", "page 2", "这一页", "删掉最后一个要点", or a focused sort_order):

      1. Resolve target 1-based page numbers.
      2. Resolve deck_dir:
           - Prefer deck_dir from earlier tool results in this task.
           - Else call ppt_find_deck() — decks are shared across this conversation's
             step tasks, so a deck from an earlier generate_ppt run is found here.
           - Only if ppt_find_deck reports no deck at all: build the deck with Mode B,
             and say in your reply that no previous deck was found so the whole deck
             was generated. Never silently redraw every page for an edit request.
      3. Always patch the page outline first for a content change (remove/replace/add
         a bullet or data point, retitle, reword the narrative):
           ppt_read_page_outline(deck_dir, page=N)     → see indexed bullets
           ppt_patch_page_outline(deck_dir, page=N, ops_json=[...])
         Put every edit for that page in one ops_json call. Skip this only when the
         request is purely visual (layout/style/"重画好看点") and the content stands.
         When you remove an item, check visual_hints in the same call: if it states a
         count ("底部横向排列四个指标卡片"), patch it too with set_field, or page-html
         keeps the old column count and invents a filler item in place of what you
         deleted. Act on every warning the patch tool returns.
      4. Then make the slide match, choosing ONE of:
         a) Exact removal / retext of something already on the slide, page otherwise
            fine — edit the HTML directly, no LLM redraw, nothing else can drift:
              ppt_read_page_html(deck_dir, page=N)        → element list with el ids
              ppt_edit_page_html(deck_dir, page=N, ops_json=[
                {"op": "delete_node", "el": "kpi-4"}])
            Address elements by the el id from ppt_read_page_html — ids are stable, so
            this is exactly "delete this one item" with nothing else touched. Use group
            to drop a heading plus its body together. Pages generated before ids existed
            report repeated_classes instead: use class+index there. A bare text match is
            the last resort; the tool refuses ambiguous matches and lists candidates.
            It republishes the page itself.
         b) The page needs redrawing (new/added content, changed layout):
              ppt_run_stage(deck_dir=<abs>, stage='page-html', page=N)
            (auto-publishes preview_html + notes stub into the UI)
            Optional polish:
              ppt_run_stage(deck_dir=<abs>, stage='refine-page', page=N)
            (refined HTML is written to page_NNN.refined.html — only adopt it if clearly better;
             otherwise keep page_NNN.html; if you adopt refined, copy/overwrite page_NNN.html
             then call ppt_publish_pages(deck_dir, pages=N))
      5. Do NOT ppt_read_page_html + save_artifacts for the HTML body (too large; gets stuck).
         If auto-publish did not run, call:
           ppt_publish_pages(deck_dir, pages=N)
      6. Update notes only if asked — write a richer spoken introduction (not a one-liner):
           save_artifacts([{key:'preview_notes', content_type:'text', value:<paragraph>, sort_order:N}])
           Target ~120-280 Chinese characters (or 4–7 sentences): open with the page goal,
           walk key points/data on the slide, explain why it matters, close with a transition.
      7. Stop after the requested page(s) appear in the UI.
         Do NOT export PPTX — the user downloads via the UI Export button.
      Never call ppt_init_deck or stage='outline'/'style' for a single-page edit —
      that rebuilds the deck and discards the other pages the user already accepted.

      ### B) Full deck generation (default)
      Follow this exact tool sequence (one stage per call; do not skip):

      1. ppt_init_deck — pass only these (omit unused optionals; never pass null):
           user_query=<merged request>,
           page_count=<int 1-10>,
           topic=<short topic>,
           role / audience / scene=<from analysis>,
           style_hint=<visual style text>,
           image_source='none'  (string! not null; use 'ai-gen' only if user asked
             for AI-generated decoration. Collected KB/web photos are attached
             automatically from ppt_register_material_images — keep image_source='none'),
           key_points_json='["point1","point2"]'  (JSON string, or omit)
         Defaults: ppt_mode=fast, infographic_source=echarts.
         → keep deck_dir absolute path for all later calls.
         → Check material_images_attached in the tool result. If collect registered
           images but attached=0, call ppt_attach_material_images(deck_dir) once.

      2. ppt_run_stage(deck_dir, stage='preflight')
      3. ppt_run_stage(deck_dir, stage='style')
      4. ppt_run_stage(deck_dir, stage='outline')
         Outline must assign Pool-B reference_images (from collect) via
         use_image.reference_image_index so page-html embeds them in slide HTML.
      5. ppt_run_stage(deck_dir, stage='asset-plan')
      6. If image_source is not none and asset-plan has pending image slots:
           ppt_run_stage(deck_dir, stage='batch-gen-image', concurrency=2)
         Otherwise skip (material images do not need batch-gen-image).
      7. ppt_run_stage(deck_dir, stage='batch-page-html', concurrency=2)
         This stage auto-publishes each finished page into preview_html (+ notes draft)
         as soon as that page HTML is ready — the left filmstrip updates page-by-page.
         Do NOT call ppt_read_page_html or save_artifacts for the HTML bodies afterward.
      8. ppt_list_pages(deck_dir) to confirm count.
         If published_count looks wrong / UI empty, call once:
           ppt_publish_pages(deck_dir)
      9. REQUIRED — rewrite preview_notes for EVERY published page into a richer spoken
         introduction (do not leave the auto draft as-is). For each sort_order N:
           save_artifacts([{
             key:'preview_notes', content_type:'text', sort_order:N,
             value:<one continuous paragraph, ~120-280 Chinese chars / 4–7 sentences>
           }])
         Each note must: (a) state the page purpose, (b) cover the main points/numbers
         visible on that slide, (c) add brief interpretation for the audience, (d) end
         with a one-sentence close or transition. Match the user's language. No bullet lists.
      10. Stop. Do NOT call any export / pptx tool — PPTX is downloaded only when
         the user clicks the UI Export button.

      ## Hard rules
      - Never invent slide JSON (layout/theme enums). Never paste incomplete HTML stubs.
      - Never hand-write or save_artifacts full slide HTML when a ppt_run_stage fails.
        Fix the stage error and retry the tool — do not bypass.
      - Never ppt_read_page_html + save_artifacts for full HTML (tool results >16KB are
        offloaded; the model cannot re-save the body and the UI stays blank forever).
        Always use ppt_publish_pages / rely on auto-publish from page-html stages.
      - Never export PPTX from tools (no ppt_export_pptx, no stage=export, no
        python-pptx). Export is UI-click only.
      - All visible slide text must match the user's language.
      - Prefer CSS/SVG/ECharts visuals; avoid remote image URLs.
      - After tools finish, stop — do not regenerate pages by hand.

      Stop after preview_html pages are published.
    tools:
      - ppt_init_deck
      - ppt_find_deck
      - ppt_attach_material_images
      - ppt_run_stage
      - ppt_list_pages
      - ppt_publish_pages
      - ppt_read_page_html
      - ppt_read_page_outline
      - ppt_patch_page_outline
      - ppt_edit_page_html
    inputs:
      - material: requirement_analysis
        required: true
      - material: material_summary
        required: false
      - material: material_images
        required: false
    outputs:
      - material: preview_html
      - material: preview_notes
    acceptance_criteria: |
      For a full run: at least 2 aligned preview_html HTML pages must be saved
      (DOCTYPE/html documents), with matching preview_notes sort_order.
      preview_notes should be richer spoken intros (~120+ Chinese chars / multiple
      sentences), not one-line stubs.
      Do not require a PPTX file artifact — export is UI-only.
      For a partial page edit: only the requested sort_order rows need updating
      with HTML preview_html.
