services:
  milvus-etcd:
    image: quay.io/coreos/etcd:v3.5.25
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: 1000
      ETCD_QUOTA_BACKEND_BYTES: 4294967296
      ETCD_SNAPSHOT_COUNT: 50000
    volumes:
      - milvus-etcd:/etcd
    command: etcd -advertise-client-urls=http://milvus-etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  milvus-minio:
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - milvus-minio:/minio_data
    command: minio server /minio_data --console-address ":9001"
    ports:
      - "${MILVUS_MINIO_API_PORT:-9002}:9000"
      - "${MILVUS_MINIO_CONSOLE_PORT:-9003}:9001"
    restart: unless-stopped

  milvus:
    image: milvusdb/milvus:${MILVUS_IMAGE_TAG:-v2.6.11}
    command: ["sh", "-c", "sleep 15 && exec milvus run standalone"]
    environment:
      MINIO_REGION: us-east-1
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: milvus-minio:9000
      MINIO_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - milvus-data:/var/lib/milvus
    ports:
      - "${MILVUS_PORT:-19531}:19530"
      - "${MILVUS_HEALTH_PORT:-9092}:9091"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    depends_on:
      milvus-etcd:
        condition: service_healthy
      milvus-minio:
        condition: service_started
    restart: unless-stopped

  attu:
    profiles:
      - dashboard
    image: zilliz/attu:${ATTU_IMAGE_TAG:-v2.6.3}
    environment:
      MILVUS_URL: milvus:19530
    ports:
      - "${ATTU_PORT:-3001}:3000"
    depends_on:
      milvus:
        condition: service_healthy
    restart: unless-stopped

  opensearch:
    image: opensearchproject/opensearch:${OPENSEARCH_IMAGE_TAG:-2.18.0}
    environment:
      cluster.name: opensearch-cluster
      node.name: opensearch-node1
      discovery.type: single-node
      bootstrap.memory_lock: "true"
      OPENSEARCH_JAVA_OPTS: ${OPENSEARCH_JAVA_OPTS:--Xms512m -Xmx512m}
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${OPENSEARCH_INITIAL_ADMIN_PASSWORD:-LazyRAG_OpenSearch123!}
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    ports:
      - "${OPENSEARCH_PORT:-9201}:9200"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -s -k -u admin:\"$$OPENSEARCH_INITIAL_ADMIN_PASSWORD\" https://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  opensearch-dashboards:
    profiles:
      - dashboard
    image: opensearchproject/opensearch-dashboards:${OPENSEARCH_IMAGE_TAG:-2.18.0}
    environment:
      OPENSEARCH_HOSTS: '["https://opensearch:9200"]'
    ports:
      - "${OPENSEARCH_DASHBOARDS_PORT:-5602}:5601"
    depends_on:
      opensearch:
        condition: service_healthy
    restart: unless-stopped

volumes:
  milvus-etcd:
  milvus-minio:
  milvus-data:
  opensearch-data:
