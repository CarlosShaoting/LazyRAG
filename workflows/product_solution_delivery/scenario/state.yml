      - {material: material_digest, required: false}
      - {material: design_escalation, required: false}
    outputs:
      - {material: delivery_summary}
      - {material: stage_manifest}
      - {material: workspace_state}
    acceptance_criteria: |
      Exactly one selected-stage artifact is registered, the Workspace stops at
      awaiting-stage-confirmation, and the visible summary offers continue/switch/export/finish
      without exposing the internal contracts.
