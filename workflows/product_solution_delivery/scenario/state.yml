      - {material: design_context_approved, required: true}
      - {material: product_materials, required: false}
      - {material: reference_sample, required: false}
      - {material: workspace_seed, required: false}
      - {material: stage_approval, required: false}
      - {material: upstream_direction, required: false}
      - {material: upstream_competitive, required: false}
      - {material: upstream_design, required: false}
      - {material: upstream_prd, required: false}
      - {material: upstream_prototype, required: false}
      - {material: upstream_review, required: false}
      - {material: upstream_handoff, required: false}
      - {material: design_escalation, required: false}
      - {material: design_routing_record, required: true}
    outputs:
      - {material: design_assessment}
      - {material: design_section_plan, required: false}
      - {material: design_chapters, required: false}
