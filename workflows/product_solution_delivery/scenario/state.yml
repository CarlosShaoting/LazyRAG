initial: __start__

transitions:
  __start__: [{to: route_product_stage}]
  route_product_stage:
    - {to: build_direction_outline, when: 父 Router 的 selected_stage 是 direction}
    - {to: analyze_competitive_position, when: 父 Router 的 selected_stage 是 competitive}
    - {to: route_design_scope, when: 父 Router 的 selected_stage 是 design}
    - {to: build_prd_outline, when: 父 Router 的 selected_stage 是 prd}
    - {to: build_interactive_prototype, when: 父 Router 的 selected_stage 是 prototype}
    - {to: build_review_outline, when: 父 Router 的 selected_stage 是 review}
    - {to: build_handoff_outline, when: 父 Router 的 selected_stage 是 handoff}
  build_direction_outline: [{to: write_direction_document}]
  write_direction_document: [{to: finalize_product_delivery}]
  analyze_competitive_position: [{to: finalize_product_delivery}]
  route_design_scope:
    - {to: collect_design_light_evidence, when: 第二层 Router 的 overall_effort 是 light}
    - {to: collect_design_heavy_evidence, when: 第二层 Router 的 overall_effort 是 heavy}
  collect_design_light_evidence: [{to: build_design_outline}]
  collect_design_heavy_evidence: [{to: build_design_outline}]
  build_design_outline: [{to: write_design_document}]
  write_design_document: [{to: finalize_product_delivery}]
  build_prd_outline: [{to: write_prd_document}]
  write_prd_document: [{to: finalize_product_delivery}]
  build_interactive_prototype: [{to: finalize_product_delivery}]
  build_review_outline: [{to: write_review_document}]
  write_review_document: [{to: finalize_product_delivery}]
  build_handoff_outline: [{to: write_handoff_document}]
  write_handoff_document: [{to: finalize_product_delivery}]
  finalize_product_delivery: [{to: __end__}]

steps:
  route_product_stage:
    label: 产品阶段 Router
    mode: human
    route: choice
    execution: &parent_router_execution
      max_rounds: 5
      timeout_seconds: 120
      hard_repeat_limit: 3
      disable_artifact_reads: true
      compact_summary: true
      tool_call_limits:
        load_product_skill_contract: 1
        publish_product_route: 2
        profile_product_materials: 2
    route_selector:
      material: routing_record
      field: selected_stage
      targets:
        direction: build_direction_outline
        competitive: analyze_competitive_position
        design: route_design_scope
        prd: build_prd_outline
        prototype: build_interactive_prototype
        review: build_review_outline
        handoff: build_handoff_outline
    prompt: |
      {{runtime_instruction}}

      This is the authoritative parent Router, not a retrieval preflight and not a business stage.
      Call load_product_skill_contract(stage_id="router") once and apply its priority exactly:
      explicit stage selection > high-confidence deterministic rule > model recommendation. The
      requested_stage value "由 Router 判断" is not an explicit stage. When the runtime instruction
      contains an Original workflow request plus a later Continue/Confirm authorization, route from
      that original request; the acknowledgement never replaces or weakens its explicit stage choice.
      After the Host completes its initial Ask-user clarification, a clean new project with no
      explicit stage, bound project artifact or uploaded product material must select direction.
      After direction is delivered, competitive is the first recommended next stage, but it still
      waits for the normal human Continue confirmation. Explicit stage selection remains authoritative
      and can start at any supported stage.
      Construct one routing record
      with selected_stage, route_source, route_reason, confidence, alternatives and stage_chain.
      confidence must be explicit/high/low, never a percentage. stage_chain is empty unless the user
      explicitly authorized multiple stages; when present, set stage_chain_authorized=true and keep
      the shortest valid forward plan. selected_stage is the only stage authorized in this Workflow
      Session; stage_chain never authorizes automatic continuation.

      The Host, not the model, is authoritative for an explicit stage. Even if requested_stage was
      accidentally bound as "由 Router 判断", publish_product_route restores a clearly commanded
      stage from stage_approval or the exact original runtime request. Never countermand it.
      Omitted optional parameters use the project's default policy: auto depth, stage-specific
      length, a supplied reference sample or the default structure. Do not stop to ask for these
      settings. This configured project-default policy intentionally replaces the portable Skill's
      separate reference-sample question; do not invent a claim that the user uploaded a sample.
      The host binds the outgoing edge to routing_record.selected_stage deterministically;
      do not request a different control.next_step. Keep runtime_trace internal; never display a
      Skill receipt. When workspace_seed/stage_approval are bound, preserve their workspace identity,
      exact version references and user-authorized next stage. Neither continue nor document approval
      means all proposed decisions are accepted. execution_depth=auto delegates depth to the child.
      This is one shared product project, not a new business task. Use the bound stage_approval's
      request_context as the latest explicit change request, retaining product_goal as the project
      goal. Reuse bound project materials, prior decisions and known stage preferences; do not ask
      the user to copy documents, upload the same files again, or open a separate task/window.
      A bound upstream_<selected_stage> is the previous version of this same stage's view: preserve
      unchanged decisions/content and make only the requested revision, with a new version. Other
      stages remain available in the shared project panel even though they are not executed here.

      After routing, prepare a closed evidence handoff for selected_stage from already bound project
      materials only. Evidence collection belongs to the selected business stage, never this Router.
      Include the relevant bound upstream_* files, product_materials and reference_sample in
      profile_product_materials with their exact Workflow paths as one JSON array. Preserve the seed's
      selected versions and fact/proposed/accepted labels; do not treat every attachment as accepted. Never call
      read_user_attachment and never materialize scalar parameters as files. If no files are bound,
      call it with [] so resource_profiles still exists. Input slot labels are schema names, not paths:
      never pass ["product_materials"], ["reference_sample"] or an upstream_* slot name as though it
      were a filename. Only copy actual kind=path values present in Workflow Material Bindings. If that
      authoritative bindings block contains only scalar values such as product_goal, pass [] exactly.
      The tool result already includes inline
      profiles plus a resource_profiles file path. Pass that exact path to the terminal publisher;
      never pass an embedded:// Skill resource as resource_profiles_path. When no file-like material
      is bound, the terminal publisher also accepts an omitted path and creates the same honest empty
      inventory in the Workflow workspace; do not fabricate a path.
      do not read it or save it yourself.

      After profile_product_materials succeeds, call publish_product_route once with the routing
      record, the exact scalar inputs, and the exact resource_profiles path returned by the profiler.
      For every optional scalar that is absent from Workflow Material Bindings, omit it or pass an
      empty string. Never invent placeholders such as "stage-specific", "default", "not specified"
      or "由 Router 判断"; project defaults are applied by the terminal publisher.
      This terminal publisher normalizes the route contract, preserves any explicit stage, creates
      the honest inherited-evidence inventory, and saves every Router output in one host-owned unit.
      If it rejects a genuinely unsupported field, repair all reported fields together and retry
      once. After it succeeds, stop immediately; do not call save_artifacts and do not generate an
      additional recap. Never claim a search succeeded when none ran.
    tools: [load_product_skill_contract, publish_product_route, profile_product_materials]
    terminal_tools: [publish_product_route]
    inputs:
      - {material: product_goal, required: true}
      - {material: requested_stage, required: false}
      - {material: execution_depth, required: false}
      - {material: word_target, required: false}
      - {material: reference_sample_choice, required: false}
      - {material: product_materials, required: false}
      - {material: reference_sample, required: false}
      - {material: workspace_seed, required: false}
      - {material: stage_approval, required: false}
      - {material: upstream_direction, required: false}
      - {material: upstream_competitive, required: false}
      - {material: upstream_design, required: false}
      - {material: upstream_prd, required: false}
      - {material: upstream_prototype, required: false}
      - {material: upstream_review, required: false}
      - {material: upstream_handoff, required: false}
    outputs:
      - {material: routing_record}
      - {material: execution_plan}
      - {material: routing_summary}
      - {material: hide_direction, required: false}
      - {material: hide_competitive, required: false}
      - {material: hide_design, required: false}
      - {material: hide_prd, required: false}
      - {material: hide_prototype, required: false}
      - {material: hide_review, required: false}
      - {material: hide_handoff, required: false}
      - {material: research_evidence}
      - {material: research_log}
      - {material: material_digest}
      - {material: resource_profiles}
    acceptance_criteria: |
      The parent routing record satisfies the source contract, exactly one business-stage edge is
      selected, the closed evidence handoff contains no invented retrieval, and user files are
      profiled exactly once.

  build_direction_outline:
    label: 产品方向大纲生成
    mode: human
    execution: &outline_execution
      max_rounds: 4
      timeout_seconds: 300
      hard_repeat_limit: 3
      disable_artifact_reads: true
      compact_summary: true
      tool_call_limits:
        load_product_skill_contract: 1
        product_writer_generate_outline_from_inputs: 1
        product_writer_revise_markdown: 1
        save_artifacts: 2
    rerun_when: 用户要求重新生成、调整或局部修改产品方向大纲。
    prompt: |
      {{runtime_instruction}}

      Call load_product_skill_contract(stage_id="direction") once and follow the complete child
      contract for this stage. Then continue with the Writer bridge.
      On first generation call product_writer_generate_outline_from_inputs(
      user_request="{{user_input}}", stage_id="direction"). The business bridge resolves every
      bound input and performs Writer context preparation, generation, normalization, validation and
      context refresh. Do not call generic file/Artifact tools or any lower-level Writer tool. Save
      writing_task, writing_context, outline, outline_report and approved_context respectively as
      direction_task, direction_context, direction_outline, direction_outline_report and
      direction_context_approved. On rerun revise the latest direction_outline only with
      document_slot="direction_outline". The editable Markdown is the sole structural source. Stop
      for user editing and Continue approval.
    tools: [load_product_skill_contract, product_writer_generate_outline_from_inputs, product_writer_revise_markdown]
    fail_fast_tools: [product_writer_generate_outline_from_inputs, product_writer_revise_markdown]
    inputs:
      - {material: execution_plan, required: true}
      - {material: research_evidence, required: true}
      - {material: resource_profiles, required: true}
      - {material: product_materials, required: false}
      - {material: reference_sample, required: false}
      - {material: workspace_seed, required: false}
      - {material: stage_approval, required: false}
      - {material: upstream_direction, required: false}
      - {material: upstream_competitive, required: false}
      - {material: upstream_design, required: false}
      - {material: upstream_prd, required: false}
      - {material: upstream_prototype, required: false}
      - {material: upstream_review, required: false}
      - {material: upstream_handoff, required: false}
    outputs:
      - {material: direction_task}
      - {material: direction_context}
      - {material: direction_outline}
      - {material: direction_outline_report}
      - {material: direction_context_approved}
    acceptance_criteria: One editable, structurally valid direction outline exists and is approved by the user.

  write_direction_document:
    label: 产品方向文档生成
    mode: human
    execution: &document_execution
      max_rounds: 7
      timeout_seconds: 720
      hard_repeat_limit: 3
      disable_artifact_reads: true
      compact_summary: true
      tool_call_limits:
        load_product_skill_contract: 1
        validate_product_stage_assessment: 2
        product_writer_generate_document_from_inputs: 1
        product_writer_revise_markdown: 1
        save_artifacts: 2
    rerun_when: 用户要求修改、补充或局部重写产品方向文档。
    prompt: |
      {{runtime_instruction}}

      Completion requires this exact order: (1) generate or revise the document, (2) load the
      direction child contract, (3) obtain one valid normalized direction assessment, and only then
      (4) call save_artifacts with the assessment and the document outputs. A generated document or
      a successful early artifact save is not completion. Do not call save_artifacts before the
      validator succeeds, and never emit a final response while direction_assessment is unsaved.
      Use the latest approved direction_outline as the only structure. On first generation call
      product_writer_generate_document_from_inputs(stage_id="direction"). The business bridge reads
      immutable bound inputs, plans sections, streams/resumes Writer checkpoints, assembles the
      draft and refreshes context. It publishes each optional chapter directly to direction_chapters;
      do not save that slot again. Do not call generic file/Artifact lookup tools or reconstruct
      intermediate paths. Retain its section_plan, document, document_html and writing_context paths
      for the final save as direction_section_plan, direction_document, direction_document_html and
      direction_context_final. The HTML is the deterministic interactive view of the same Markdown;
      do not ask a second model to rewrite it. Chapter publish
      warnings are non-blocking; do not retry generation or call another tool for them. On rerun use targeted revision only with
      document_slot="direction_document". After the validator and final save succeed, stop for user
      editing and Continue approval.
      After producing or revising the artifact, call load_product_skill_contract(stage_id="direction")
      with reference_paths omitted if the current step has not loaded its child contract. Never pass
      input/output material paths, runtime/workspace paths, or Writer-returned section_plan, document
      or writing_context paths as reference_paths; those are artifacts, not packaged Skill references.
      Make one valid validate_product_stage_assessment call. Put the stage inside value, for example
      validate_product_stage_assessment(value={"stage":"direction","status":"draft"}); never pass
      stage as a sibling/top-level tool argument. The value argument has the authoritative stage-aware JSON Schema;
      include the child-decided facts, omit optional empty collections, and do not invent
      alternate nesting. The validator allocates
      missing proposed decision IDs, supplies safe defaults, and reports every remaining invalid path
      together. If it rejects the payload, repair all listed paths together and retry once only. Save
      the normalized JSON as direction_assessment.
      Keep this assessment internal. Every check needs an actual evidence reference; use not-checked
      for unperformed checks. Missing/conflicting required inputs mean draft, never reviewable.
      Document edits or Continue do not accept decisions: accepted needs its own user acceptance_ref.
      For prototype, untested desktop/mobile interactions remain not-checked and the result is a draft.
      Only handoff may claim implementation readiness, after its required checks and dependencies pass.
      After saving outputs, respond with one short natural-language status sentence (at most 80 Chinese
      characters). Never expose assessment/Manifest/Workspace JSON, runtime paths, chapter lists, tool
      diagnostics or a long recap; the editable artifact already appears in this project's shared view.
    tools: [load_product_skill_contract, validate_product_stage_assessment, product_writer_generate_document_from_inputs, product_writer_revise_markdown]
    fail_fast_tools: [product_writer_generate_document_from_inputs, product_writer_revise_markdown]
    inputs:
      - {material: execution_plan, required: true}
      - {material: direction_task, required: true}
      - {material: direction_outline, required: true}
      - {material: direction_context_approved, required: true}
      - {material: product_materials, required: false}
      - {material: reference_sample, required: false}
      - {material: workspace_seed, required: false}
      - {material: stage_approval, required: false}
      - {material: upstream_direction, required: false}
      - {material: upstream_competitive, required: false}
      - {material: upstream_design, required: false}
      - {material: upstream_prd, required: false}
      - {material: upstream_prototype, required: false}
      - {material: upstream_review, required: false}
      - {material: upstream_handoff, required: false}
    outputs:
      - {material: direction_assessment}
      - {material: direction_section_plan, required: false}
      - {material: direction_chapters, required: false}
      - {material: direction_document}
      - {material: direction_document_html}
      - {material: direction_context_final}
    acceptance_criteria: The editable direction brief follows the approved outline and preserves evidence and decision status.

  analyze_competitive_position:
    label: 竞品与生态位分析
    mode: human
    execution: &artifact_execution
      max_rounds: 7
      timeout_seconds: 600
      hard_repeat_limit: 3
      disable_artifact_reads: true
      compact_summary: true
      tool_call_limits:
        # The model may reload once after context compaction; the loader is
        # read-only and idempotent, so a second call must not fail the stage.
        load_product_skill_contract: 2
        validate_product_stage_assessment: 2
        # One recovery read is allowed because large shared-project inputs can be
        # compacted by the model runtime. The prompt still directs the agent to
        # read once during the normal path.
        load_product_stage_inputs: 2
        write_product_artifact_bundle: 1
        save_artifacts: 2
    prompt: |
      {{runtime_instruction}}

      Call load_product_skill_contract(stage_id="competitive") once; it returns the compact
      stage contract and never source snapshots. Then call
      load_product_stage_inputs(stage_id="competitive") once and use only its material contents;
      never call read_file, get_artifact, find_artifact, grep or list_artifacts for Workflow inputs.
      When upstream_competitive is present, revise that project's existing report according to the
      latest stage_approval.request_context, preserving unaffected findings and their original
      evidence dates; do not treat old public facts as newly verified. No re-upload or new window
      is needed to continue this shared project view.
      The returned research_evidence, material_digest and optional approved direction_document are
      the closed evidence set. The report must answer both current-product comparison and full
      ecosystem positioning across direct, indirect, substitute, status-quo and adjacent options.
      Generate one logical report with two synchronized representations: a compact responsive
      self-contained interactive HTML (the default view) and a Markdown document (the editable and
      downloadable view). Both must contain the same facts, recommendations, evidence dates,
      uncertainty and section semantics; do not independently invent or omit conclusions. Start
      with a plain-Chinese conclusion: what the market looks like, where this product should compete,
      and what the team should do next. Then show the comparison table, ecosystem position and product
      implications. Put research method, source limits and unresolved questions in one collapsed
      “依据与待确认” section at the end. Do not show workflow terms, evidence grades, tool states,
      artifact fields, English status values, or WEB-NNN/KB-NNN notation. When a real source exists,
      present its human title and link; when none exists, say only “本轮未使用外部资料，关键判断仍待验证”.
      Separate facts from recommendations through section headings and natural sentences, never by
      prefixing every paragraph with status labels. Both formats must be visually rich: use tables,
      a real SVG quadrant/coordinate chart when its axes and points are supported, and a dated event
      timeline when numeric trend data is insufficient. Markdown uses GFM tables, fenced Mermaid
      diagrams and only real bound images; HTML uses accessible inline SVG and interactive details.
      Call write_product_artifact_bundle(html_filename="competitive-analysis.html",
      markdown_filename="competitive-analysis.md", validate_as="competitive") once with both
      complete bodies. Save its returned html_path verbatim as competitive_analysis and its returned
      markdown_path verbatim as competitive_analysis_markdown, both with content_type="file"; never
      save or repeat source bodies as file values. Stop for approval.
      After producing or revising the artifact, call load_product_skill_contract(stage_id="competitive")
      if the current step has not loaded its child contract. Load only applicable references from
      available_resources. Make one valid validate_product_stage_assessment call. Put the stage inside
      value, for example validate_product_stage_assessment(value={"stage":"competitive","status":"draft"});
      never pass stage as a sibling/top-level tool argument. The value argument has the authoritative stage-aware JSON Schema;
      include the child-decided facts, omit optional empty collections, and do
      not invent alternate nesting. The validator allocates
      missing proposed decision IDs, supplies safe defaults, and reports every remaining invalid path
      together. If it rejects the payload, repair all listed paths together and retry once only. Save
      the normalized JSON as competitive_assessment.
      Keep this assessment internal. Every check needs an actual evidence reference; use not-checked
      for unperformed checks. Missing/conflicting required inputs mean draft, never reviewable.
      Document edits or Continue do not accept decisions: accepted needs its own user acceptance_ref.
      For prototype, untested desktop/mobile interactions remain not-checked and the result is a draft.
      Only handoff may claim implementation readiness, after its required checks and dependencies pass.
      After saving outputs, respond with one short natural-language status sentence (at most 80 Chinese
      characters). Never expose assessment/Manifest/Workspace JSON, runtime paths, chapter lists, tool
      diagnostics or a long recap; the artifact already appears in this project's shared view.
    tools: [load_product_skill_contract, validate_product_stage_assessment, load_product_stage_inputs, write_product_artifact_bundle]
    fail_fast_tools: [load_product_stage_inputs, write_product_artifact_bundle]
    inputs:
      - {material: execution_plan, required: true}
      - {material: research_evidence, required: true}
      - {material: research_log, required: true}
      - {material: material_digest, required: true}
      - {material: product_materials, required: false}
      - {material: reference_sample, required: false}
      - {material: workspace_seed, required: false}
      - {material: stage_approval, required: false}
      - {material: upstream_direction, required: false}
      - {material: upstream_competitive, required: false}
      - {material: upstream_design, required: false}
      - {material: upstream_prd, required: false}
      - {material: upstream_prototype, required: false}
      - {material: upstream_review, required: false}
      - {material: upstream_handoff, required: false}
    outputs:
      - {material: competitive_assessment}
      - {material: competitive_analysis}
      - {material: competitive_analysis_markdown}
    acceptance_criteria: The synchronized HTML and Markdown lead with the same readable market conclusion, use evidence-bound visuals, and keep research details separate.

  route_design_scope:
    label: 产品方案内部 Router
    mode: human
    route: choice
    execution: &design_router_execution
      max_rounds: 5
      timeout_seconds: 120
      hard_repeat_limit: 3
      disable_artifact_reads: true
      compact_summary: true
      tool_call_limits:
        load_product_skill_contract: 1
        publish_design_route_compact: 1
    route_selector:
      material: design_routing_record
      field: overall_effort
      targets: {light: collect_design_light_evidence, heavy: collect_design_heavy_evidence}
    prompt: |
      {{runtime_instruction}}

      The parent Router has already selected design. This is the only second-layer Router; do not
      create another top-level stage Router. Call load_product_skill_contract(stage_id="design",
      reference_paths=["references/boundary-and-routing.md", "references/evidence-and-effort.md",
      "references/human-in-the-loop.md", "references/multi-source-research.md"]). Classify the actual changed product objects into
      exactly these two layers and six canonical domain ids. Preserve explicit scope and risk signals
      from the Original workflow request when the latest message is only Continue/Confirm; that short
      authorization must not erase a requested heavy path or its privacy/permission/cross-tenant gates:
      - product mechanism: domain_state, behavior_policy_trust, ia_semantics
      - product experience: journey_interaction_service, ui_visual_system, content_communication

      Classify every changed object with one primary domain and any affected linked domains. Determine
      light/heavy per primary domain from cost/reversibility, practice divergence, impact/coupling and
      uncertainty; do not average scores. privacy, identity, permission, silent_write, cross_tenant
      and high_loss_irreversible are non-compensatory gates and force behavior_policy_trust to heavy.
      Parent execution_depth is only an input-completeness/change-scope hint and must not overwrite
      this light/heavy result.

      This Router classifies scope and effort from bound project evidence only; it never performs
      retrieval. When bound evidence is insufficient to judge practice divergence, trust risk or a
      hard gate, mark the uncertainty explicitly and choose heavy so the following evidence stage
      can resolve it. Do not claim inaccessible product behavior was verified.

      Make exactly one publish_design_route_compact call. Its arguments are short scalar strings,
      never JSON objects or arrays: primary_domains, linked_domains and heavy_domains are
      comma-separated canonical domain ids; hard_gates is a comma-separated canonical gate list;
      decision_summary is one concise Chinese sentence (at most 120 Chinese characters). Omit an
      empty field. The Host restores hard gates from the immutable project goal, builds and validates
      the complete decision array and escalation triggers, then saves design_routing_record, the exact
      light/heavy selector, and a deterministic Chinese summary.
      Do not rewrite, translate, expand, or save those outputs yourself. The host binds exactly one
      matching outgoing edge. Stop immediately after publication so the user can confirm the framed
      design scope before evidence collection continues.
    tools: [load_product_skill_contract, publish_design_route_compact]
    terminal_tools: [publish_design_route_compact]
    inputs:
      - {material: routing_record, required: true}
      - {material: execution_plan, required: true}
      - {material: research_evidence, required: true}
      - {material: material_digest, required: true}
      - {material: product_materials, required: false}
      - {material: reference_sample, required: false}
      - {material: workspace_seed, required: false}
      - {material: stage_approval, required: false}
      - {material: upstream_direction, required: false}
      - {material: upstream_competitive, required: false}
      - {material: upstream_design, required: false}
      - {material: upstream_prd, required: false}
      - {material: upstream_prototype, required: false}
      - {material: upstream_review, required: false}
      - {material: upstream_handoff, required: false}
    outputs:
      - {material: design_routing_record}
      - {material: design_effort_route}
      - {material: design_routing_summary}
    acceptance_criteria: |
      The record activates only actual primary/linked design domains, assigns every subdecision one
      validated effort, honors all hard gates, and selects exactly one light or heavy edge.

  collect_design_light_evidence:
    label: 产品方案轻量取证
    mode: human
    execution: &light_evidence_execution
      max_rounds: 20
      timeout_seconds: 480
      hard_repeat_limit: 3
      disable_artifact_reads: true
      compact_summary: true
      tool_call_limits:
        load_product_skill_contract: 2
        validate_design_escalation: 1
        web_search: 3
        url_fetch: 3
        kb: 3
        save_artifacts: 2
    prompt: |
      {{runtime_instruction}}

      First call load_product_skill_contract(stage_id="design") with reference_paths omitted; the
      Host includes references for all primary/linked domains from design_routing_record. Canonical
      design-domain ids are routing values, not resource paths: never pass behavior_policy_trust,
      domain_state, journey_interaction_service or another domain id as reference_paths. If
      offloaded, read the returned file
      with read_file in bounded pages (limit=80, advance offset until EOF) instead of reloading.
      Batch only a genuinely missing exact `references/*.md` value from returned
      available_resources into one supplementary call.
      Execute only the light research
      route authorized by design_routing_record. First verify the current product evidence already
      bound to this step. Add external evidence only where it can change a scoped decision; use
      selected knowledge bases through kb and public sources through web_search/url_fetch. Do not
      broaden into inactive design domains and do not search planned future stages. Record every
      actual source as WEB-NNN/KB-NNN and distinguish current fact, external fact, inference,
      recommendation and unknown.

      If sustained counterexamples, materially divergent practices or trust risk appear, immediately
      upgrade the affected subdecisions with validate_design_escalation(value={...}) and save its
      design_escalation output. Keep the approved primary/linked scope unchanged, record the triggering
      evidence and affected decisions, and load the corresponding heavy references. Finish the heavy
      research requirements within this step; never send the user back to the stage Router merely
      to increase research effort. Retain light treatment for unrelated light decisions. If the new
      evidence changes the approved scope or reveals a hard risk gate, pause for explicit scoped user
      confirmation before recommending a high-risk default, and preserve its source reference.
      Save the complete decision-evidence packet, including the upgrade and evidence gaps, as
      design_light_evidence. The Writer must consume this effective upgraded record.
    tools: [validate_design_escalation, load_product_skill_contract, read_file, web_search, url_fetch, kb]
    inputs:
      - {material: design_routing_record, required: true}
      - {material: research_evidence, required: true}
      - {material: research_log, required: true}
      - {material: material_digest, required: true}
      - {material: product_materials, required: false}
      - {material: reference_sample, required: false}
      - {material: workspace_seed, required: false}
      - {material: stage_approval, required: false}
      - {material: upstream_direction, required: false}
      - {material: upstream_competitive, required: false}
      - {material: upstream_design, required: false}
      - {material: upstream_prd, required: false}
      - {material: upstream_prototype, required: false}
      - {material: upstream_review, required: false}
      - {material: upstream_handoff, required: false}
    outputs:
      - {material: design_escalation, required: false}
      - {material: design_light_evidence}
    acceptance_criteria: |
      Evidence stays within the approved design scope, supports each light decision at an honest
      conclusion strength, and exposes any trigger that requires escalation.

  collect_design_heavy_evidence:
    label: 产品方案重型取证
    mode: human
    execution: &heavy_evidence_execution
      max_rounds: 24
      timeout_seconds: 600
      hard_repeat_limit: 3
      disable_artifact_reads: true
      compact_summary: true
      publisher_fallback_tool: publish_design_heavy_unavailable
      tool_call_limits:
        load_product_skill_contract: 2
        web_search: 6
        url_fetch: 4
        kb: 4
        publish_design_heavy_evidence: 1
        publish_design_heavy_unavailable: 1
    prompt: |
      {{runtime_instruction}}

      First call load_product_skill_contract(stage_id="design") with reference_paths omitted. The Host automatically includes
      references for every primary/linked domain in the bound design_routing_record. Read the
      returned contract completely; if the result is offloaded, use read_file on that exact
      returned file path in bounded pages (limit=80, advance offset until EOF), not another call
      to load_product_skill_contract. Canonical design-domain ids are routing values, not resource
      paths: never pass behavior_policy_trust, domain_state, journey_interaction_service or another
      domain id as reference_paths. Batch only a genuinely missing exact `references/*.md` value
      from returned available_resources into one supplementary reference_paths call. Execute the child contract's
      heavy research requirements for every heavy subdecision. Unless the contract tool result
      explicitly says `Large result offloaded to file` and supplies a `File path`, it already contains
      the complete selected contract: do not call read_file. In particular, available_resources are
      embedded package identifiers, not attachments or read_file targets. After loading the contract,
      inspect the actual callable tool list. If web_search is actually callable, make at least one
      real web_search attempt. Otherwise, make a kb attempt only when both a knowledge-base search
      tool is actually callable and the runtime supplied exact inherited kb_ids. If neither condition
      is true, do not emit a query, an arguments fragment, or pretend to call an unavailable tool:
      immediately call publish_design_heavy_unavailable with exactly {}. A failed read_file call is
      never evidence that web_search, url_fetch or kb is unavailable.
      First verify the current product;
      then sample genuinely different product forms without assuming a mainstream answer. Use kb
      only when the runtime supplies exact inherited kb_ids; never guess "default", enumerate KBs,
      or invent an id. If a scoped kb attempt fails, close that channel immediately. Use web_search
      for current public facts. Call url_fetch only with an exact URL returned by successful
      web_search or present in bound evidence; never synthesize, guess or use example URLs. Preserve
      the domain-specific minimum sample/output requirements from the loaded contract. Separate
      verified current fact, official external fact, inference, suggested default, project-specific
      preference and unknown. Hard-gate decisions must retain human review, rollback and responsibility
      boundaries even when evidence is strong.

      Write the packet in Chinese (keep source IDs and proper nouns unchanged). Tool availability is
      itself evidence metadata: when kb, web_search or url_fetch is unavailable, fails, or returns no
      usable source, state that limitation explicitly for every affected decision, classify the
      unsupported conclusion as unknown or a hypothesis, and lower its evidence-strength ceiling.
      In that situation the packet must not say that there are no gaps, that evidence is sufficient,
      or that an external fact was verified. Absence of a retrieved counterexample is not evidence that
      no counterexample exists.

      Loading the contract and replying with a plan or future intention is not completion. Finish
      through exactly one of the two publisher paths below; never call both, never stop at “next I
      will research”, and never call generic artifact writers. The Host writes a conservative Chinese
      packet from the approved routing record, keeps unbound findings at E0, and records concrete gaps
      and hard-gate confirmations.

      If no usable source was returned, call publish_design_heavy_unavailable() with exactly {}.
      This is the only allowed unavailable path: do not construct value, decisions, tool_statuses or
      source placeholders, and do not call publish_design_heavy_evidence. The Host fills every routed
      decision as an explicit E0 unknown.

      Only when retrieval returned at least one usable exact source locator, call
      publish_design_heavy_evidence with one top-level argument named value. Keep the complete
      serialized tool-call arguments under 700 characters so the local model cannot truncate the
      JSON. Include at most one decision for which the attempt produced a candidate observation;
      omitted routed decisions are filled as explicit E0 unknowns by the Host. Use this compact shape:
      {"value":{"retrieval_status":"limited","tool_statuses":{"web_search":"partial"},"decisions":[{"decision_id":"DES-001","finding":"short candidate","source_refs":["exact URL or knowledge-base document id returned by a tool"],"counterevidence":"short negative case","conditions":["short condition"],"remaining_gaps":["short gap"]}]}}.
      Omit unused tool statuses and empty optional observation fields. Never place decisions inside
      tool_statuses. Never invent a source ref: the Host resolves submitted
      locators against the live source registry, rejects unknown locators, caps validated candidate
      bindings at E1 pending semantic human review, and keeps unbound claims at E0. If retrieval
      produced no usable result or this rich call is rejected, use the zero-argument unavailable
      publisher. After a successful rich publication, respond immediately and never call the fallback.
      The controlled completion status remains limited
      until every routed decision has mechanically complete coverage and a human reviews semantic
      source binding plus the activated domain's minimum heavy-research requirements.

      The published design_heavy_evidence is a Markdown evidence packet containing decision-by-decision
      coverage, divergent/negative cases, conditions explaining differences, evidence-strength
      ceiling, gaps and the explicit items requiring user confirmation. Never invent access to a
      logged-in UI or claim verification that did not occur. Stop for evidence sufficiency and risk
      confirmation before drafting begins.
    tools: [load_product_skill_contract, read_file, web_search, url_fetch, kb, publish_design_heavy_evidence, publish_design_heavy_unavailable]
    terminal_tools: [publish_design_heavy_unavailable]
    fail_fast_tools: [publish_design_heavy_unavailable]
    inputs:
      - {material: design_routing_record, required: true}
      - {material: research_evidence, required: true}
      - {material: research_log, required: true}
      - {material: material_digest, required: true}
      - {material: product_materials, required: false}
      - {material: reference_sample, required: false}
      - {material: workspace_seed, required: false}
      - {material: stage_approval, required: false}
      - {material: upstream_direction, required: false}
      - {material: upstream_competitive, required: false}
      - {material: upstream_design, required: false}
      - {material: upstream_prd, required: false}
      - {material: upstream_prototype, required: false}
      - {material: upstream_review, required: false}
      - {material: upstream_handoff, required: false}
    outputs:
      - {material: design_heavy_evidence}
    acceptance_criteria: |
      Heavy evidence satisfies the activated domain contracts or explicitly lowers the conclusion
      ceiling, includes contrary evidence, and records all hard-gate confirmations and boundaries.

