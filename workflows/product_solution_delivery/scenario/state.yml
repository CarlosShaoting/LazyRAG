  write_design_document:
    label: 产品方案文档生成
    mode: human
    execution: *document_execution
    rerun_when: 用户要求修改、补充或局部重写产品方案文档。
    prompt: |
      {{runtime_instruction}}

      Completion requires this exact order: (1) generate or revise the document, (2) load the design
      child contract, (3) obtain one valid normalized design assessment, and only then (4) call
      save_artifacts with the assessment and the document outputs. A generated document or a
      successful early artifact save is not completion. Do not call save_artifacts before the
      validator succeeds, and never emit a final response while design_assessment is unsaved.
      Use the latest approved design_outline as the only structure. On first generation call
      product_writer_generate_document_from_inputs(stage_id="design"). It publishes each optional
      chapter directly to design_chapters; do not save that slot again. Retain its section_plan,
      document, document_html and writing_context paths for the final save as design_section_plan,
      design_document, design_document_html and design_context_final. The HTML is the deterministic
      interactive view of the same Markdown; do not ask a second model to rewrite it. Chapter publish
      warnings are non-blocking; do not retry generation or
      call another tool for them. The bridge owns file binding,
      section planning, checkpoint streaming, assembly and context refresh. Apart from the final
      save_artifacts call, do not call generic file/Artifact lookup or write tools or reconstruct
      intermediate paths. On rerun use targeted revision only
      with document_slot="design_document". After the validator and final save succeed, stop for
      user editing and Continue approval.
      After producing or revising the artifact, call load_product_skill_contract(stage_id="design")
      with reference_paths omitted if the current step has not loaded its child contract. Never pass
      input/output material paths, runtime/workspace paths, or Writer-returned section_plan, document
      or writing_context paths as reference_paths; those are artifacts, not packaged Skill references.
      Make one valid validate_product_stage_assessment call. Put the stage inside value, for example
      validate_product_stage_assessment(value={"stage":"design","status":"draft"}); never pass stage
      as a sibling/top-level tool argument. The value argument has the authoritative stage-aware JSON
      Schema; include the child-decided facts, omit optional empty collections, and do not invent
      alternate nesting. The validator allocates
      missing proposed decision IDs, supplies safe defaults, and reports every remaining invalid path
      together. If it rejects the payload, repair all listed paths together and retry once only. Save
      the normalized JSON as design_assessment.
      Keep this assessment internal. Every check needs an actual evidence reference; use not-checked
      for unperformed checks. Missing/conflicting required inputs mean draft, never reviewable.
      Document edits or Continue do not accept decisions: accepted needs its own user acceptance_ref.
      For prototype, untested desktop/mobile interactions remain not-checked and the result is a draft.
      Only handoff may claim implementation readiness, after its required checks and dependencies pass.
      After saving outputs, respond with one short natural-language status sentence (at most 80 Chinese
      characters). Never expose assessment/Manifest/Workspace JSON, runtime paths, chapter lists, tool
      diagnostics or a long recap; the editable artifact already appears in this project's shared view.
    tools: [load_product_skill_contract, validate_product_stage_assessment, product_writer_generate_document_from_inputs, product_writer_revise_markdown]
    fail_fast_tools: [product_writer_generate_document_from_inputs, product_writer_revise_markdown]
    inputs:
