  write_review_document:
    label: 方案评审报告生成
    mode: human
    execution: *document_execution
    rerun_when: 用户要求修改、补充或局部重写评审报告。
    prompt: |
      {{runtime_instruction}}

      Completion requires this exact order: (1) generate or revise the document, (2) load the review
      child contract, (3) obtain one valid normalized review assessment, and only then (4) call
      save_artifacts with the assessment and the document outputs. A generated document or a
      successful early artifact save is not completion. Do not call save_artifacts before the
      validator succeeds, and never emit a final response while review_assessment is unsaved.
      Use the latest approved review_outline as the only structure. On first generation call
      product_writer_generate_document_from_inputs(stage_id="review"). It publishes each optional
      chapter directly to review_chapters; do not save that slot again. Retain its section_plan,
      document, document_html and writing_context paths for the final save as review_section_plan,
      review_document, review_document_html and review_context_final. The HTML is the deterministic
      interactive view of the same Markdown; do not ask a second model to rewrite it. Chapter publish
      warnings are non-blocking; do not retry generation or
      call another tool for them. The bridge owns file binding,
      section planning, checkpoint streaming, assembly and context refresh. Apart from the final
      save_artifacts call, do not call generic file/Artifact lookup or write tools. Preserve
      severity, evidence, affected layer and recommended action, and
      never silently modify reviewed upstream artifacts. On rerun use targeted revision only with
      document_slot="review_document". After the validator and final save succeed, stop for user
      editing and Continue approval.
      After producing or revising the artifact, call load_product_skill_contract(stage_id="review")
      with reference_paths omitted if the current step has not loaded its child contract. Never pass
      input/output material paths, runtime/workspace paths, or Writer-returned section_plan, document
      or writing_context paths as reference_paths; those are artifacts, not packaged Skill references.
      Make one valid validate_product_stage_assessment call. Put the stage inside value, for example
      validate_product_stage_assessment(value={"stage":"review","status":"draft"}); never pass stage
      as a sibling/top-level tool argument. The value argument has the authoritative stage-aware JSON
      Schema; include the child-decided facts, omit optional empty collections, and do not invent
      alternate nesting. The validator allocates
      missing proposed decision IDs, supplies safe defaults, and reports every remaining invalid path
      together. If it rejects the payload, repair all listed paths together and retry once only. Save
      the normalized JSON as review_assessment.
      Keep this assessment internal. Every check needs an actual evidence reference; use not-checked
      for unperformed checks. Missing/conflicting required inputs mean draft, never reviewable.
      Document edits or Continue do not accept decisions: accepted needs its own user acceptance_ref.
      For prototype, untested desktop/mobile interactions remain not-checked and the result is a draft.
      Only handoff may claim implementation readiness, after its required checks and dependencies pass.
      After saving outputs, respond with one short natural-language status sentence (at most 80 Chinese
      characters). Never expose assessment/Manifest/Workspace JSON, runtime paths, chapter lists, tool
      diagnostics or a long recap; the editable artifact already appears in this project's shared view.
    tools: [load_product_skill_contract, validate_product_stage_assessment, product_writer_generate_document_from_inputs, product_writer_revise_markdown]
    fail_fast_tools: [product_writer_generate_document_from_inputs, product_writer_revise_markdown]
    inputs:
      - {material: execution_plan, required: true}
      - {material: review_task, required: true}
      - {material: review_outline, required: true}
      - {material: review_context_approved, required: true}
      - {material: product_materials, required: false}
      - {material: reference_sample, required: false}
      - {material: workspace_seed, required: false}
      - {material: stage_approval, required: false}
      - {material: upstream_direction, required: false}
      - {material: upstream_competitive, required: false}
      - {material: upstream_design, required: false}
      - {material: upstream_prd, required: false}
      - {material: upstream_prototype, required: false}
      - {material: upstream_review, required: false}
      - {material: upstream_handoff, required: false}
    outputs:
      - {material: review_assessment}
      - {material: review_section_plan, required: false}
      - {material: review_chapters, required: false}
      - {material: review_document}
      - {material: review_document_html}
      - {material: review_context_final}
    acceptance_criteria: The review report is traceable, prioritized and does not mutate reviewed artifacts.

