id: product_solution_delivery
name: 产品方案与交付
description: >
  基于 product-solution-delivery Skill 的两层 Router 内置工作流。第一层父 Router 按
  “显式阶段 > 确定性规则 > 模型推荐”选择本次 Session 唯一执行阶段；多阶段请求只登记
  后续计划，不在当前 Session 自动串行。第二层 Router 仅在父 Router 选择 design 时启用，
  按产品机制/产品体验下的六类对象登记主责与联动范围，再逐个子决策判定 light/heavy 研究
  强度。七个阶段都把同一逻辑产物交付为默认交互 HTML 与可编辑 Markdown；文本阶段
  复用 LazyMind Writer 并从 Markdown 确定性渲染 HTML，竞品与原型在一次有界调用中成对发布。

when_to_use: >
  当用户希望梳理产品方向、分析竞品与生态位、设计产品机制/流程/UI、编写 PRD、制作交互
  原型、评审既有产品产物、准备研发交付，或明确要求规划连续阶段时使用。用户点名阶段时
  必须尊重；未点名时由第一层 Router 选择入口。连续请求登记最短合法 stage_chain，但当前
  Session 只执行 selected_stage，阶段交付后等待用户继续或切换。同一项目的阶段始终在当前会话
  窗口中完成，自动沿用材料、已接受决定和各视图的选定版本。启动只需产品目标；首次 Ask user
  完成后，若是没有显式阶段、既有项目产物或上传材料的全新项目，固定先进入产品方向。产品方向
  交付并经人工确认继续后，优先进入竞品与生态位。显式阶段选择仍可从任意支持阶段进入。执行深度
  默认 auto、篇幅按阶段默认值、有样例则沿用，没有则按默认结构；这些设置
  不要求用户重复补填。缺少业务事实时保留明确假设和草稿缺口，不为完成全流程编造事实或批准。
  只有关键决定确实需要用户判断时在当前窗口确认。不得创建独立“意图识别”业务阶段。
  不得用于单独市场
  规模测算、路线图排序、技术架构、发布运维、数据分析方案或营销文案。

runtime:
  exclusive_tool_capabilities: [writer.create, writer.revise]
  collects_knowledge: true
  # The parent Router's terminal publisher writes these slots as one validated unit. Business
  # stages keep their existing canonical publication paths and add one synchronized view slot.
  publisher_owned_slots:
    - routing_record
    - execution_plan
    - routing_summary
    - hide_direction
    - hide_competitive
    - hide_design
    - hide_prd
    - hide_prototype
    - hide_review
    - hide_handoff
    - research_evidence
    - research_log
    - material_digest
    - resource_profiles
    - design_routing_record
    - design_effort_route
    - design_routing_summary
    - design_heavy_evidence
    - delivery_summary
    - stage_manifest
    - workspace_state
  clarification_fields:
    - id: product_goal
      label: 产品目标
      question: 你想解决什么产品问题，主要给谁使用？
      type: text
      binding: request_context

tool_scripts:
  - path: scripts/tools.py
    functions:
      - load_product_skill_contract
      - load_product_stage_inputs
      - validate_product_route
      - publish_product_route
      - validate_design_route
      - publish_design_route
      - publish_design_route_compact
      - publish_design_heavy_evidence
      - publish_design_heavy_unavailable
      - build_product_handoff_state
      - publish_product_handoff_state
      - validate_product_stage_assessment
      - validate_design_escalation
      - normalize_product_parameters
      - write_product_artifact_file
      - write_product_artifact_bundle
  - path: scripts/writer_bridge.py
    functions:
      - profile_product_materials
      - product_writer_generate_outline_from_inputs
      - product_writer_generate_document_from_inputs
      - product_writer_revise_markdown

artifact_actions:
  rewrite_selection:
    slots:
      - direction_outline
      - direction_document
      - design_outline
      - design_document
      - prd_outline
      - prd_document
      - review_outline
      - review_document
      - handoff_outline
      - handoff_document
    preview_tool: builtin:document.rewrite_selection.v1
    execute_tool: builtin:document.rewrite_selection.v1

