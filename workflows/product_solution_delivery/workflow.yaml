ui:
  # UI hide flags never authorize execution; route_selector binds persisted choices.
  tab_visibility_ready_material: routing_record
  slots:
    routing_summary: {widgetType: text-markdown, readOnly: true}
    research_evidence: {widgetType: text-markdown, readOnly: true, maxHeight: 680}
    research_log: {widgetType: text-markdown, readOnly: true}
    material_digest: {widgetType: text-markdown, readOnly: true, maxHeight: 680}
    direction_outline: {widgetType: file-card, readOnly: false}
    direction_outline_report: {widgetType: text-markdown, readOnly: true}
    direction_chapters: {widgetType: file-card, readOnly: true, collapsed: true}
    direction_document: {widgetType: file-card, readOnly: false}
    direction_document_html: {widgetType: html-preview, readOnly: true}
    competitive_analysis: {widgetType: html-preview, readOnly: true}
    competitive_analysis_markdown: {widgetType: file-card, readOnly: false}
    design_routing_summary: {widgetType: text-markdown, readOnly: true}
    design_light_evidence: {widgetType: text-markdown, readOnly: true, maxHeight: 680}
    design_heavy_evidence: {widgetType: text-markdown, readOnly: true, maxHeight: 680}
    design_outline: {widgetType: file-card, readOnly: false}
    design_outline_report: {widgetType: text-markdown, readOnly: true}
    design_chapters: {widgetType: file-card, readOnly: true, collapsed: true}
    design_document: {widgetType: file-card, readOnly: false}
    design_document_html: {widgetType: html-preview, readOnly: true}
    prd_outline: {widgetType: file-card, readOnly: false}
    prd_outline_report: {widgetType: text-markdown, readOnly: true}
    prd_chapters: {widgetType: file-card, readOnly: true, collapsed: true}
    prd_document: {widgetType: file-card, readOnly: false}
    prd_document_html: {widgetType: html-preview, readOnly: true}
    prototype: {widgetType: html-preview, readOnly: true}
    prototype_markdown: {widgetType: file-card, readOnly: false}
    review_outline: {widgetType: file-card, readOnly: false}
    review_outline_report: {widgetType: text-markdown, readOnly: true}
    review_chapters: {widgetType: file-card, readOnly: true, collapsed: true}
    review_document: {widgetType: file-card, readOnly: false}
    review_document_html: {widgetType: html-preview, readOnly: true}
    handoff_outline: {widgetType: file-card, readOnly: false}
    handoff_outline_report: {widgetType: text-markdown, readOnly: true}
    handoff_chapters: {widgetType: file-card, readOnly: true, collapsed: true}
    handoff_document: {widgetType: file-card, readOnly: false}
    handoff_document_html: {widgetType: html-preview, readOnly: true}
    delivery_summary: {widgetType: text-markdown, readOnly: true}
  tabs:
    - id: routing
      step_id: route_product_stage
      label: 开始
      layout: composite
      slots: [{id: routing_summary}, {id: research_evidence}]
      composite_layout:
        direction: row
        children:
          - {slot: routing_summary, weight: 2}
          - {slot: research_evidence, weight: 1}
    - id: direction_outline
      step_id: build_direction_outline
      label: 方向大纲
      hide_when_material: hide_direction
      layout: composite
      slots: [{id: direction_outline}, {id: direction_outline_report}]
      composite_layout: {direction: row, children: [{slot: direction_outline, weight: 2}, {slot: direction_outline_report, weight: 1}]}
    - {id: direction_document, step_id: write_direction_document, label: 产品方向, hide_when_material: hide_direction, layout: list, slots: [{id: direction_document_html}, {id: direction_document}, {id: direction_chapters}]}
    - {id: competitive, step_id: analyze_competitive_position, label: 竞品生态位, hide_when_material: hide_competitive, layout: list, slots: [{id: competitive_analysis}, {id: competitive_analysis_markdown}]}
    - id: design_router
      step_id: route_design_scope
      status_step_ids: [route_design_scope, collect_design_light_evidence, collect_design_heavy_evidence]
      label: 方案范围与证据
      hide_when_material: hide_design
      layout: list
      slots: [{id: design_routing_summary}, {id: design_light_evidence}, {id: design_heavy_evidence}]
      composite_behavior:
        visible_when:
          - {slot: design_light_evidence, material: design_routing_record, path: data.overall_effort, equals: light}
          - {slot: design_heavy_evidence, material: design_routing_record, path: data.overall_effort, equals: heavy}
    - id: design_outline
      step_id: build_design_outline
      label: 方案大纲
      hide_when_material: hide_design
      layout: composite
      slots: [{id: design_outline}, {id: design_outline_report}]
      composite_layout: {direction: row, children: [{slot: design_outline, weight: 2}, {slot: design_outline_report, weight: 1}]}
    - {id: design_document, step_id: write_design_document, label: 产品方案, hide_when_material: hide_design, layout: list, slots: [{id: design_document_html}, {id: design_document}, {id: design_chapters}]}
